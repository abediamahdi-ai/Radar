
name: Daily Radar Auto-Sync

on:
  schedule:
    - cron: '45 6,13 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-sync
  cancel-in-progress: false

jobs:
  update-radar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync approved Radar metrics
        env:
          RADAR_CSV_URL: ${{ secrets.RADAR_CSV_URL }}
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          url = os.environ.get("RADAR_CSV_URL")
          if not url:
              raise RuntimeError("Missing RADAR_CSV_URL secret")

          req = urllib.request.Request(
              url,
              headers={"User-Agent": "Radar-Sync/1.0"}
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              csv_text = response.read().decode("utf-8-sig")

          rows = list(csv.reader(io.StringIO(csv_text)))

          # Only approved, non-sensitive summary metrics
          allowed = {
              "تعداد جلسات ۷ روز آینده": "weeklyMeetings",
              "چرخه ارزیابی عملکرد (از ۵ دپارتمان)": "performanceCycle",
          }

          metrics = {}

          for row in rows:
              if len(row) < 2:
                  continue

              key = row[0].strip()
              value = row[1].strip()

              if key in allowed and value:
                  metrics[allowed[key]] = value

          if len(metrics) != len(allowed):
              missing = set(allowed.values()) - set(metrics)
              raise RuntimeError(
                  f"Missing required metrics: {sorted(missing)}"
              )

          output = {
              "lastSync": datetime.now(
                  timezone.utc
              ).isoformat(),
              "metrics": metrics
          }

          Path("radar-data.json").write_text(
              json.dumps(
                  output,
                  ensure_ascii=False,
                  indent=2
              ) + "\n",
              encoding="utf-8"
          )

          print("Radar metrics synced successfully")
          PY

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add radar-data.json

          if ! git diff --cached --quiet; then
            git commit -m "data: sync Radar metrics"
            git push
          else
            echo "No changes to commit"
          fi
